[package]
name = "jsraft-cli"
version.workspace = true
edition.workspace = true
description = "JSRaft CLI binary"
default-run = "jsraft"

[[bin]]
name = "jsraft"
path = "src/main.rs"

[dependencies]
jsraft-core = { path = "../core" }
jsraft-bundler = { path = "../bundler" }
jsraft-lint = { path = "../lint" }
jsraft-fmt = { path = "../fmt" }
jsraft-pkg = { path = "../pkg" }
clap = { workspace = true }
clap_complete = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
notify = { workspace = true }
dirs = { workspace = true }
which = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }
glob = { workspace = true }
